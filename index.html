<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zaffari Express Route</title>

  <!-- PWA & Favicon para iOS / Safari -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3144/3144456.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zaffari Route">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body id="app-body" class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen pb-12 transition-colors duration-200">
  <div class="max-w-md mx-auto p-4">
    
    <!-- Cabeçalho -->
    <header class="mb-4 flex justify-between items-center">
      <div class="text-left">
        <h1 class="text-2xl font-bold text-red-600 dark:text-red-500">Zaffari Express</h1>
        <div class="flex items-center gap-2 mt-0.5">
          <span id="list-id-tag" class="text-xs bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300 font-mono px-2 py-0.5 rounded">
            Lista: ...
          </span>
          <button onclick="changeListId()" class="text-xs text-gray-500 dark:text-gray-400 hover:text-red-600 underline">
            Trocar
          </button>
        </div>
      </div>
      <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 text-lg hover:opacity-80">
        <span id="theme-icon">🌙</span>
      </button>
    </header>

    <!-- Painel 1: Edição da Lista -->
    <div id="panel-edit" class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-4 mb-6 transition-colors">
      <h2 class="text-lg font-semibold mb-3">Lista de Compras</h2>
      
      <div class="flex gap-2 mb-4">
        <input type="text" id="item-input" 
               onkeydown="if(event.key === 'Enter') addItem()"
               placeholder="Ex: sabonete, pão, carne, leite..." 
               class="flex-1 border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        <button onclick="addItem()" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
          + Add
        </button>
      </div>

      <ul id="shopping-list" class="divide-y divide-gray-100 dark:divide-gray-700 mb-4">
        <!-- Itens inseridos aparecem aqui -->
      </ul>

      <div class="flex gap-2">
        <button id="btn-start" onclick="startShopping()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg text-center hidden shadow transition">
          🚀 Iniciar Compras (Gerar Rota)
        </button>
        <button id="btn-clear" onclick="clearList()" class="bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 font-semibold px-3 py-3 rounded-lg text-xs hidden hover:bg-red-100 hover:text-red-600">
          Limpar Tudo
        </button>
      </div>
    </div>

    <!-- Painel 2: Modo Compras / Rota -->
    <div id="panel-route" class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-4 hidden transition-colors">
      <div class="flex justify-between items-center mb-4 border-b dark:border-gray-700 pb-2">
        <h2 class="text-lg font-semibold text-green-600 dark:text-green-400">Rota Otimizada</h2>
        <button onclick="resetApp()" class="text-xs text-gray-500 hover:text-red-500 underline">Editar Lista</button>
      </div>

      <div id="route-steps" class="space-y-3">
        <!-- Passos gerados via JS -->
      </div>
    </div>

  </div>

  <script>
    /* -------------------------------------------------------------
       1. CÓDIGO DA LISTA (Identificador Único por Navegador/Celular)
    ----------------------------------------------------------------- */
    let currentListId = localStorage.getItem('zaffari_current_list_id');
    
    if (!currentListId) {
      currentListId = 'lista-' + Math.random().toString(36).substring(2, 7);
      localStorage.setItem('zaffari_current_list_id', currentListId);
    }

    function updateListDisplay() {
      document.getElementById('list-id-tag').innerText = `Lista: ${currentListId}`;
    }

    function changeListId() {
      const newId = prompt("Digite o nome ou código da lista que deseja usar:", currentListId);
      if (newId && newId.trim() !== "") {
        const cleanId = normalize(newId).replace(/\s+/g, '-');
        currentListId = cleanId;
        localStorage.setItem('zaffari_current_list_id', currentListId);
        updateListDisplay();
        initStorageAndFirebase();
      }
    }

    /* -------------------------------------------------------------
       2. CREDENCIAIS REALTIME FIREBASE (Zaffari Express)
    ----------------------------------------------------------------- */
    const firebaseConfig = {
      apiKey: "AIzaSyAhPZsHhHbCJ5zGmXE5rfEmBkzIkF9NcxM",
      authDomain: "zaffari-express.firebaseapp.com",
      databaseURL: "https://zaffari-express-default-rtdb.firebaseio.com",
      projectId: "zaffari-express",
      storageBucket: "zaffari-express.firebasestorage.app",
      messagingSenderId: "557092628586",
      appId: "1:557092628586:web:4406662f3559bd74ab0213"
    };

    let useFirebase = false;
    let dbRef = null;

    try {
      firebase.initializeApp(firebaseConfig);
      useFirebase = true;
    } catch (e) {
      console.warn("Erro ao inicializar Firebase. Operando via localStorage.", e);
    }

    /* -------------------------------------------------------------
       3. MAPEAMENTO DOS SETORES DA LOJA
    ----------------------------------------------------------------- */
    function normalize(text) {
      return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    const SECTORS = [
      { id: "bebidas", order: 1, zone: "Entrada / Frente", name: "Bebidas, Sorvetes e Gelo", tags: ["bebida", "refrigerante", "agua", "suco", "sorvete", "gelo", "cerveja", "vinho", "espumante", "energetico"] },
      { id: "laticinios", order: 2, zone: "Corredor Central - Esquerda", name: "Laticínios e Manteigas", tags: ["iogurte", "requeijao", "margarina", "manteiga", "yakult"] },
      { id: "frios", order: 3, zone: "Fundos - Esquerda", name: "Frios e Queijos", tags: ["linguicinha", "linguica", "bacon", "salame", "queijo", "frios", "presunto", "peito de peru", "mortadela"] },
      { id: "graos", order: 4, zone: "Frente - Esquerda", name: "Grãos e Mercearia Seca", tags: ["arroz", "feijao", "farinha", "açucar", "acucar", "sal", "achocolatado", "nescau", "toddy", "graos", "farofa"] },
      { id: "leite_ovos", order: 5, zone: "Corredor Central - Esquerda", name: "Leite e Ovos", tags: ["leite", "ovo", "ovos", "leite desnatado", "leite integral"] },
      { id: "padaria", order: 6, zone: "Fundos - Esquerda/Meio", name: "Padaria e Pães", tags: ["padaria", "pao", "paes", "salgado", "doce de padaria", "suco natural de laranja", "doce de festa", "cuca"] },
      { id: "acougue", order: 8, zone: "Fundos - Direita", name: "Açougue e Peixaria", tags: ["acougue", "carne", "carnes", "frango", "carne de porco", "porco", "peixe", "peixes", "picanha", "maminha", "costela", "alcatra", "moida"] },
      { id: "cama_mesa_banho", order: 9, zone: "Fundos - Extrema Direita", name: "Cama, Mesa e Banho", tags: ["roupa", "pijama", "roupa de cama", "travesseiro", "toalha", "coberta", "lençol"] },
      { id: "prataria", order: 10, zone: "Corredor Central - Extrema Direita", name: "Prataria e Cerâmicas", tags: ["prataria", "ceramica", "prato", "copo", "caneca", "talher", "panela", "decoracao"] },
      { id: "pet_ferragem", order: 11, zone: "Corredor Central - Direita", name: "Ferragem, Carro e Pet", tags: ["ferragem", "ferramenta", "oleo", "carro", "parafuso", "conserto", "racao", "gato", "cachorro", "pet"] },
      { id: "hortifruti", order: 12, zone: "Corredor Central - Meio", name: "Hortifruti e Flores", tags: ["hortifruti", "fruta", "verdura", "legume", "banana", "maca", "tomate", "cebola", "alho", "batata", "cenoura", "alface", "flores", "flor"] },
      { id: "cereais", order: 13, zone: "Corredor Central - Meio/Esquerda", name: "Cereais e Salgadinhos", tags: ["cereal", "barrinha", "barrinha de cereal", "sucrilhos", "chocolate", "salgadinho", "doritos", "cheetos", "fandangos", "bala", "bombom"] },
      { id: "molhos", order: 14, zone: "Corredor Central - Esquerda", name: "Molhos e Enlatados", tags: ["leite condensado", "molho", "extrato de tomate", "creme de leite", "leite em po", "enlatado", "milho", "ervilha", "sardinha", "atun", "tempero", "fermento", "pasta de amendoim"] },
      { id: "eletronicos", order: 15, zone: "Frente - Extrema Direita", name: "Eletrônicos e Cigarros", tags: ["eletronico", "tv", "radio", "computador", "eletrodomestico", "geladeira", "isqueiro", "cigarro", "pilha"] },
      { id: "bazar", order: 16, zone: "Frente - Direita", name: "Bazar e Papelaria", tags: ["papelaria", "brinquedo", "camping", "praia", "churrasco", "pote", "pote de plastico", "pote de vidro", "carvao"] },
      { id: "higiene_limpeza", order: 17, zone: "Frente - Próximo aos Caixas", name: "Higiene e Limpeza", tags: ["sabonete", "papel higienico", "shampoo", "condicionador", "desodorante", "creme dental", "pasta de dente", "lenco umedecido", "agua sanitaria", "detergente", "sabao", "amaciante", "esponja", "pano", "limpeza"] },
      { id: "doces_compotas", order: 18, zone: "Frente - Próximo aos Caixas", name: "Doces em Compota e Gelatinas", tags: ["doce", "compota", "mumu", "doce de leite", "bolo", "bolo pronto", "gelatina", "pudim"] },
      { id: "biscoitos_cafe", order: 19, zone: "Frente - Próximo aos Caixas", name: "Biscoitos, Café e Massas", tags: ["biscoito", "bolacha", "cafe", "massa", "macarrao", "erva mate", "spaghetti", "miojo"] }
    ];

    let items = [];

    /* -------------------------------------------------------------
       4. OPERAÇÕES DE BANCO DE DADOS E SINCRONIZAÇÃO
    ----------------------------------------------------------------- */
    function saveItems() {
      localStorage.setItem(`zaffari_items_${currentListId}`, JSON.stringify(items));
      if (useFirebase && dbRef) {
        dbRef.set(items);
      }
    }

    function initStorageAndFirebase() {
      updateListDisplay();

      if (useFirebase) {
        if (dbRef) dbRef.off();
        dbRef = firebase.database().ref(`lists/${currentListId}`);
        
        dbRef.on('value', (snapshot) => {
          const val = snapshot.val();
          items = val ? val : [];
          renderList();
        });
      } else {
        const local = localStorage.getItem(`zaffari_items_${currentListId}`);
        items = local ? JSON.parse(local) : [];
        renderList();
      }
    }

    function findSector(itemName) {
      const cleanInput = normalize(itemName);
      let bestMatch = null;
      let maxTagLength = 0;

      for (const sector of SECTORS) {
        for (const tag of sector.tags) {
          const cleanTag = normalize(tag);
          if (cleanInput.includes(cleanTag)) {
            if (cleanTag.length > maxTagLength) {
              maxTagLength = cleanTag.length;
              bestMatch = sector;
            }
          }
        }
      }
      return bestMatch || SECTORS[3];
    }

    function addItem() {
      const input = document.getElementById('item-input');
      const val = input.value.trim();
      if (!val) return;

      const sector = findSector(val);
      items.push({ id: Date.now(), name: val, sector: sector, checked: false });
      input.value = '';
      saveItems();
      renderList();
    }

    function removeItem(id) {
      items = items.filter(i => i.id !== id);
      saveItems();
      renderList();
    }

    function clearList() {
      if (confirm(`Tem certeza que deseja apagar a lista "${currentListId}"?`)) {
        items = [];
        saveItems();
        renderList();
      }
    }

    function renderList() {
      const listEl = document.getElementById('shopping-list');
      const btnStart = document.getElementById('btn-start');
      const btnClear = document.getElementById('btn-clear');
      listEl.innerHTML = '';

      items.forEach(item => {
        listEl.innerHTML += `
          <li class="py-2.5 flex justify-between items-center text-sm">
            <span>
              <strong>${item.name}</strong> 
              <span class="text-xs text-gray-400 dark:text-gray-500 block">Setor: ${item.sector.name}</span>
            </span>
            <button onclick="removeItem(${item.id})" class="text-red-500 hover:text-red-700 text-xs px-2 py-1">Excluir</button>
          </li>
        `;
      });

      if (items.length > 0) {
        btnStart.classList.remove('hidden');
        btnClear.classList.remove('hidden');
      } else {
        btnStart.classList.add('hidden');
        btnClear.classList.add('hidden');
      }
    }

    function startShopping() {
      items.sort((a, b) => a.sector.order - b.sector.order);
      document.getElementById('panel-edit').classList.add('hidden');
      document.getElementById('panel-route').classList.remove('hidden');
      renderRoute();
    }

    function toggleCheck(id) {
      const item = items.find(i => i.id === id);
      if (item) item.checked = !item.checked;
      saveItems();
      renderRoute();
    }

    function renderRoute() {
      const routeEl = document.getElementById('route-steps');
      routeEl.innerHTML = '';

      items.forEach((item, index) => {
        const isChecked = item.checked;
        routeEl.innerHTML += `
          <div onclick="toggleCheck(${item.id})" class="p-3.5 rounded-lg border cursor-pointer transition ${isChecked ? 'bg-gray-100 dark:bg-gray-900 border-gray-200 dark:border-gray-800 opacity-50' : 'bg-red-50 dark:bg-gray-700/50 border-red-200 dark:border-gray-600 shadow-sm'}">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-xs font-bold ${isChecked ? 'text-gray-400' : 'text-red-600 dark:text-red-400'}">
                  Passo ${index + 1} • ${item.sector.zone}
                </span>
                <p class="text-base font-semibold ${isChecked ? 'line-through text-gray-400' : 'text-gray-900 dark:text-gray-100'}">
                  ${item.name} <span class="text-xs font-normal text-gray-500 dark:text-gray-400">(${item.sector.name})</span>
                </p>
              </div>
              <input type="checkbox" ${isChecked ? 'checked' : ''} class="h-5 w-5 text-red-600 rounded">
            </div>
          </div>
        `;
      });
    }

    function resetApp() {
      document.getElementById('panel-route').classList.add('hidden');
      document.getElementById('panel-edit').classList.remove('hidden');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.innerText = '🌙';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        icon.innerText = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    }

    // Inicialização do Tema e Dados
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.getElementById('theme-icon').innerText = '☀️';
    }

    initStorageAndFirebase();
  </script>
</body>
</html>
