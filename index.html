<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaffari Rota Otimizada</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">
  <div class="max-w-md mx-auto p-4">
    <!-- Cabeçalho -->
    <header class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-red-700">Zaffari Express Route</h1>
      <p class="text-xs text-gray-500">Início e Saída pela Entrada 1 / Caixas</p>
    </header>

    <!-- Painel 1: Adicionar Itens -->
    <div id="panel-edit" class="bg-white rounded-xl shadow-md p-4 mb-6">
      <h2 class="text-lg font-semibold mb-3">Lista de Compras</h2>
      <div class="flex gap-2 mb-4">
        <input type="text" id="item-input" placeholder="Ex: Arroz, Queijo, Detergente..." 
               class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        <button onclick="addItem()" class="bg-red-600 text-white font-semibold px-4 py-2 rounded-lg text-sm hover:bg-red-700">
          + Add
        </button>
      </div>

      <ul id="shopping-list" class="divide-y divide-gray-100 mb-4">
        <!-- Itens inseridos aparecem aqui -->
      </ul>

      <button id="btn-start" onclick="startShopping()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg text-center hidden hover:bg-green-700 shadow">
        🚀 Iniciar Compras (Gerar Rota)
      </button>
    </div>

    <!-- Painel 2: Modo Compras / Rota -->
    <div id="panel-route" class="bg-white rounded-xl shadow-md p-4 hidden">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-lg font-semibold text-green-700">Rota Otimizada</h2>
        <button onclick="resetApp()" class="text-xs text-gray-500 hover:text-red-600">Editar Lista</button>
      </div>

      <div id="route-steps" class="space-y-3">
        <!-- Passos do trajeto gerados via JS -->
      </div>
    </div>
  </div>

  <script>
    // Dicionário do Mapa baseado no desenho (Coordenadas X, Y)
    const SECTORS = [
      // Linha Frente (Y=1)
      { x: 1, y: 1, name: "Bebidas, Sorvetes e Gelo", tags: ["bebidas", "refrigerante", "agua", "suco", "sorvete", "gelo", "cerveja", "vinho"] },
      { x: 2, y: 1, name: "Grãos e Mercearia Seca", tags: ["arroz", "feijao", "farinha", "açucar", "sal", "achocolatado"] },
      { x: 3, y: 1, name: "Biscoitos, Café e Massas", tags: ["biscoito", "bolacha", "cafe", "massa", "macarrao", "erva mate"] },
      { x: 4, y: 1, name: "Doces em Compota e Gelatinas", tags: ["doce", "compota", "mumu", "bolo", "gelatina"] },
      { x: 5, y: 1, name: "Higiene e Limpeza", tags: ["detergente", "sabao", "shampoo", "papel higienico", "desodorante", "pasta de dente", "creme dental", "amaciante", "pano"] },
      { x: 6, y: 1, name: "Bazar e Papelaria", tags: ["caderno", "brinquedo", "pote", "carvao", "camping"] },
      { x: 7, y: 1, name: "Eletrônicos e Cigarros", tags: ["tv", "computador", "radio", "isqueiro", "cigarro"] },

      // Linha Meio (Y=2)
      { x: 1, y: 2, name: "Laticínios e Manteigas", tags: ["iogurte", "requeijao", "margarina", "manteiga"] },
      { x: 2, y: 2, name: "Leite e Ovos", tags: ["leite", "ovo", "ovos"] },
      { x: 3, y: 2, name: "Molhos e Enlatados", tags: ["leite condensado", "molho", "creme de leite", "leite em po", "enlatado", "tempero", "fermento", "pasta de amendoim"] },
      { x: 4, y: 2, name: "Cereais e Salgadinhos", tags: ["cereal", "chocolate", "salgadinho", "doce diferente"] },
      { x: 5, y: 2, name: "Hortifruti e Flores", tags: ["hortifruti", "fruta", "verdura", "legume", "maca", "banana", "tomate", "flores"] },
      { x: 6, y: 2, name: "Ferragem, Carro e Pet", tags: ["ferramenta", "oleo", "parafuso", "racao", "gato", "cachorro"] },
      { x: 7, y: 2, name: "Prataria e Utilidades", tags: ["prato", "copo", "caneca", "talher", "panela"] },

      // Linha Fundos (Y=3)
      { x: 1, y: 3, name: "Frios e Queijos", tags: ["queijo", "linguicinha", "bacon", "salame", "frios", "presunto"] },
      { x: 2, y: 3, name: "Padaria e Pães", tags: ["padaria", "pao", "paes", "salgado", "doce de festa", "suco de laranja"] },
      { x: 4, y: 3, name: "Açougue e Peixaria", tags: ["carne", "frango", "porco", "peixe", "maminha", "picanha", "file"] },
      { x: 6, y: 3, name: "Cama, Mesa e Banho", tags: ["roupa", "pijama", "lençol", "travesseiro", "toalha"] }
    ];

    let items = [];

    function findSector(itemName) {
      const clean = itemName.toLowerCase().trim();
      for (const sector of SECTORS) {
        if (sector.tags.some(tag => clean.includes(tag))) {
          return sector;
        }
      }
      // Se não reconhecer, joga na Mercearia Padrão (2,1)
      return SECTORS[1];
    }

    // Calcula o peso de ordenação Serpentina (S-Shape) saindo de (1,1)
    function calculateSOrder(x, y) {
      if (y === 1) return x;          // Passada 1 (Frente): Esquerda -> Direita
      if (y === 2) return 14 - x + 1; // Passada 2 (Meio): Direita -> Esquerda
      if (y === 3) return 14 + x;     // Passada 3 (Fundos): Esquerda -> Direita
      return 99;
    }

    function addItem() {
      const input = document.getElementById('item-input');
      const val = input.value.trim();
      if (!val) return;

      const sector = findSector(val);
      items.push({ id: Date.now(), name: val, sector: sector, checked: false });
      input.value = '';
      renderList();
    }

    function removeItem(id) {
      items = items.filter(i => i.id !== id);
      renderList();
    }

    function renderList() {
      const listEl = document.getElementById('shopping-list');
      const btnStart = document.getElementById('btn-start');
      listEl.innerHTML = '';

      items.forEach(item => {
        listEl.innerHTML += `
          <li class="py-2 flex justify-between items-center text-sm">
            <span><strong>${item.name}</strong> <span class="text-xs text-gray-400">(${item.sector.name})</span></span>
            <button onclick="removeItem(${item.id})" class="text-red-500 hover:text-red-700 text-xs">Excluir</button>
          </li>
        `;
      });

      if (items.length > 0) {
        btnStart.classList.remove('hidden');
      } else {
        btnStart.classList.add('hidden');
      }
    }

    function startShopping() {
      // Ordena a lista usando a rota S-Shape
      items.sort((a, b) => {
        const orderA = calculateSOrder(a.sector.x, a.sector.y);
        const orderB = calculateSOrder(b.sector.x, b.sector.y);
        return orderA - orderB;
      });

      document.getElementById('panel-edit').classList.add('hidden');
      document.getElementById('panel-route').classList.remove('hidden');
      renderRoute();
    }

    function toggleCheck(id) {
      const item = items.find(i => i.id === id);
      if (item) item.checked = !item.checked;
      renderRoute();
    }

    function renderRoute() {
      const routeEl = document.getElementById('route-steps');
      routeEl.innerHTML = '';

      items.forEach((item, index) => {
        const isChecked = item.checked;
        routeEl.innerHTML += `
          <div onclick="toggleCheck(${item.id})" class="p-3 rounded-lg border cursor-pointer transition ${isChecked ? 'bg-gray-100 opacity-50 border-gray-200' : 'bg-red-50 border-red-200 shadow-sm'}">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-xs font-bold ${isChecked ? 'text-gray-400' : 'text-red-600'}">Passo ${index + 1} • ${item.sector.name}</span>
                <p class="text-base font-semibold ${isChecked ? 'line-through text-gray-500' : 'text-gray-900'}">${item.name}</p>
              </div>
              <input type="checkbox" ${isChecked ? 'checked' : ''} class="h-5 w-5 text-red-600 rounded">
            </div>
          </div>
        `;
      });
    }

    function resetApp() {
      document.getElementById('panel-route').classList.add('hidden');
      document.getElementById('panel-edit').classList.remove('hidden');
    }
  </script>
</body>
</html>
